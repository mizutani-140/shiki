name: Shiki Release

# Tag-triggered release. Pushing a SemVer tag (e.g. v0.1.0) publishes a GitHub
# Release for that tag. This workflow uses only the built-in GITHUB_TOKEN and
# requires no additional secrets. See docs/releasing.md and
# docs/adr/SADR-0007-packaging-and-release.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish a release for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish Shiki release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${DISPATCH_TAG}" ]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify VERSION and pyproject version match tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION_FILE="$(tr -d '[:space:]' < VERSION)"
          PY_VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${PY_VER}" != "${VERSION_FILE}" ]; then
            echo "pyproject version ${PY_VER} != VERSION ${VERSION_FILE}" >&2
            echo "Bump ./VERSION and pyproject.toml together. See docs/releasing.md." >&2
            exit 1
          fi
          if [ "${TAG}" != "v${VERSION_FILE}" ]; then
            echo "tag ${TAG} != v${VERSION_FILE}" >&2
            echo "Bump ./VERSION and pyproject.toml before tagging. See docs/releasing.md." >&2
            exit 1
          fi
          echo "VERSION (${VERSION_FILE}), pyproject (${PY_VER}), and tag ${TAG} all agree."

      - name: Validate Shiki mirror
        run: python3 scripts/validate_shiki.py

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping creation."
            exit 0
          fi
          gh release create "${TAG}" \
            --title "Shiki ${TAG}" \
            --generate-notes \
            --verify-tag
