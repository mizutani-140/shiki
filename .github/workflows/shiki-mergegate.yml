name: Shiki MergeGate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read

jobs:
  mergegate:
    name: MergeGate metadata check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Shiki artifacts
        run: python3 scripts/validate_shiki.py

      - name: Prepare PR context
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf .shiki/gha
          mkdir -p .shiki/gha
          gh pr view "$PR_NUMBER" --json number,title,body,author,headRefName,baseRefName,headRefOid,labels,files,reviews,reviewDecision,statusCheckRollup > .shiki/gha/pr.json
          base_ref="$(jq -r '.baseRefName' .shiki/gha/pr.json)"
          git fetch origin "$base_ref"
          git diff --name-only "origin/${base_ref}...HEAD" > .shiki/gha/changed-files.txt
          git diff --name-status "origin/${base_ref}...HEAD" > .shiki/gha/changed-files-status.txt

          # Live Guardian-approval evidence. A Contract PR (SADR-0015) forces the
          # Guardian gate from the Goal's frozen-plan risk in THIS metadata job,
          # independent of any CCA verdict, so the check needs the same live
          # comment/label/timeline evidence shiki-cca-completion.yml gathers.
          # Without these files a high/critical contract mode PR blocks on a
          # MISSING INPUT ("Guardian comments evidence file is missing"), not a
          # missing approval. Fall back to an empty array so a fetch failure is a
          # deterministic "no approval evidence", never a broken run.
          gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" > .shiki/gha/live-guardian-comments.json || echo "[]" > .shiki/gha/live-guardian-comments.json
          gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/events" > .shiki/gha/live-guardian-events.json || echo "[]" > .shiki/gha/live-guardian-events.json
          gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline" -H "Accept: application/vnd.github+json" > .shiki/gha/live-guardian-timeline.json || echo "[]" > .shiki/gha/live-guardian-timeline.json

          # Base .shiki snapshot from origin/<base_ref>, built the SAME way
          # shiki-cca-completion.yml builds it. mergegate_check.py needs it to
          # verify task-field immutability for a post_merge_reconcile PR and to
          # resolve the SADR-0017 bookkeeping-closeout exemption; without it a
          # post_merge_reconcile PR blocks on "requires a base .shiki snapshot".
          # The fetch above already ran — do NOT add a second, or the base fetch
          # would go shallow.
          rm -rf .shiki/gha/base-shiki
          mkdir -p .shiki/gha/base-shiki
          git archive "origin/${base_ref}" .shiki | tar -x -C .shiki/gha/base-shiki || true

      - name: MergeGate metadata check
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Implementation-PR merge proof, resolved the SAME way the CCA workflow
          # resolves it (TASK_ID = T-<4+ digits> OR T-<timestamp>-<hex>, first
          # match; read expected_pr from the BASE snapshot task file — a field the
          # PR head cannot forge — and include the PR only when gh proves it
          # MERGED). Fails closed to "" on any missing or unresolvable input. A
          # post_merge_reconcile PR consumes this to prove its referenced PR
          # merged; without it the metadata check can never pass one.
          MERGED_PRS=""
          body="$(jq -r '.body // ""' .shiki/gha/pr.json 2>/dev/null || echo "")"
          task_id="$(printf '%s' "$body" | grep -oE 'T-([0-9]{4,}|[0-9]{8}T[0-9]{12}Z-[0-9a-f]{8})' | head -1 || true)"
          base_task=".shiki/gha/base-shiki/.shiki/tasks/${task_id}.json"
          if [ -n "$task_id" ] && [ -f "$base_task" ]; then
            base_pr="$(jq -r '.expected_pr // empty' "$base_task")"
            if [ -n "$base_pr" ]; then
              state="$(gh pr view "$base_pr" --repo "$REPOSITORY" --json state -q .state 2>/dev/null || echo UNKNOWN)"
              if [ "$state" = "MERGED" ]; then
                MERGED_PRS="$base_pr"
              fi
            fi
          fi

          # SADR-0015 Contract Approval carry, built the SAME way shiki-cca-completion.yml
          # builds it (from the base-branch adding commit and the MERGED PR behind it)
          # and passed to mergegate_check.py via --contract-approval. The base fetch in
          # "Prepare PR context" already retrieved origin/<base_ref> — reuse it; do NOT
          # add a second fetch and do NOT use --depth (a shallow base makes
          # `git log --diff-filter=A` return nothing and silently defeats the carry, the
          # exact defect PR #206 removed). Field names match the evaluator
          # (guardian_source, adding_commit_pr). EVERY failure path writes a well-formed
          # JSON object whose values DEFEAT the carry with a reason.
          approval_file=.shiki/gha/contract-approval.json
          ca_base_ref="$(jq -r '.baseRefName // ""' .shiki/gha/pr.json 2>/dev/null || echo "")"
          if [ -z "$task_id" ]; then
            jq -n '{applies: false, reason: "contract approval does not apply: no Shiki task id in the PR body"}' > "$approval_file"
          elif [ -z "$ca_base_ref" ]; then
            jq -n --arg t "$task_id" '{task_id: $t, applies: false, reason: "contract approval does not apply: no base ref resolved"}' > "$approval_file"
          else
            adding_commit="$(git log --diff-filter=A --format=%H "origin/${ca_base_ref}" -- ".shiki/tasks/${task_id}.json" 2>/dev/null | tail -1 || true)"
            if [ -z "$adding_commit" ]; then
              jq -n --arg t "$task_id" '{task_id: $t, merged: false, applies: false, reason: "contract approval does not apply: no commit adds this task file on the base branch (a first-registration PR is never covered)"}' > "$approval_file"
            else
              pulls="$(gh api "repos/${REPOSITORY}/commits/${adding_commit}/pulls" 2>/dev/null || echo "[]")"
              reg_pr="$(printf '%s' "$pulls" | jq 'map(select(.merged_at != null)) | (.[0].number // empty)' 2>/dev/null || echo "")"
              if [ -z "$reg_pr" ]; then
                jq -n --arg t "$task_id" --arg c "$adding_commit" '{task_id: $t, adding_commit: $c, merged: false, applies: false, reason: "contract approval does not apply: no merged PR is associated with the adding commit"}' > "$approval_file"
              else
                guardian_approved="$(printf '%s' "$pulls" | jq --argjson n "$reg_pr" 'any(.[]; .number == $n and ((.labels // []) | any(.name == "guardian:approved")))' 2>/dev/null || echo false)"
                jq -n \
                  --arg t "$task_id" \
                  --argjson pr "$reg_pr" \
                  --arg c "$adding_commit" \
                  --argjson ga "$guardian_approved" \
                  '{
                     task_id: $t,
                     pr: $pr,
                     merged: true,
                     adding_commit: $c,
                     adding_commit_pr: $pr,
                     guardian_approved: $ga,
                     guardian_source: (if $ga then "guardian_label" else "" end),
                     applies: $ga,
                     reason: (if $ga
                       then "task contract registered and Guardian-approved (guardian:approved label) on merged Contract PR \($pr) before dispatch"
                       else "contract approval does not apply: registering PR \($pr) carries no guardian:approved label" end)
                   }' > "$approval_file"
              fi
            fi
          fi
          echo "::group::contract-approval carry"
          cat "$approval_file"
          echo "::endgroup::"

          # SADR-0018 base-sync carry (guardian_comment_carried). --base-sync-carry
          # + --default-branch let a Contract PR's frozen-risk Guardian gate in this
          # metadata job carry a stale Guardian comment approval across a proven pure
          # base sync. The proof reads git over origin/<default_branch>; the base
          # fetch in "Prepare PR context" already retrieved it — do NOT add a second
          # fetch or any --depth (a shallow base makes the proof unresolvable and
          # silently disables the carry, the exact defect PR #206 removed). This run
          # body stays expression-free (WORKFLOW_RUN_EXPRESSION_FREE): DEFAULT_BRANCH
          # arrives through env: and is referenced as "$DEFAULT_BRANCH". Inert unless
          # BOTH flags are present.
          python3 scripts/mergegate_check.py \
            --changed-files-status .shiki/gha/changed-files-status.txt \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --allow-missing-cca \
            --guardian-policy .shiki/guardian-policy.json \
            --guardian-comments .shiki/gha/live-guardian-comments.json \
            --guardian-events .shiki/gha/live-guardian-events.json \
            --guardian-timeline .shiki/gha/live-guardian-timeline.json \
            --base-shiki .shiki/gha/base-shiki/.shiki \
            --merged-prs "$MERGED_PRS" \
            --contract-approval .shiki/gha/contract-approval.json \
            --base-sync-carry \
            --default-branch "$DEFAULT_BRANCH"

      # Publish the gate's own result file so the goal loop can read WHY a red
      # MergeGate check blocked (its blocking_reasons) and name those reasons in the
      # repair packet + handoff, instead of every packet saying only "required checks
      # failed: MergeGate metadata check". mergegate_check.py writes the file BEFORE it
      # exits non-zero, so `if: always()` ships it from the FAILING run — the whole
      # point. `if: always()` is SAFE here specifically: none of this job's steps
      # (Checkout, Validate Shiki artifacts, Prepare PR context, MergeGate metadata
      # check) posts a review, comment or label, so shipping on failure cannot mint an
      # approval. (The CCA workflow's Review Bridge DOES submit an APPROVE review, so
      # `if: always()` must never be added there.)
      - name: Upload MergeGate result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shiki-mergegate-result
          path: .shiki/gha/mergegate-result.json
          if-no-files-found: ignore
