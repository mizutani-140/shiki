name: Shiki CCA Completion

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to judge.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read
  id-token: write

jobs:
  cca:
    name: CCA verdict
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Shiki artifacts
        run: python3 scripts/validate_shiki.py

      - name: Prepare CCA context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          rm -rf .shiki/gha
          mkdir -p .shiki/gha
          gh pr view "$PR_NUMBER" --json number,title,body,author,headRefName,baseRefName,headRefOid,labels,files,reviews,reviewDecision,statusCheckRollup > .shiki/gha/pr.json
          base_ref="$(jq -r '.baseRefName' .shiki/gha/pr.json)"
          git fetch origin "$base_ref"
          git diff --name-only "origin/${base_ref}...HEAD" > .shiki/gha/changed-files.txt
          git diff --name-status "origin/${base_ref}...HEAD" > .shiki/gha/changed-files-status.txt

          # ADR 0017 bookkeeping-closeout exemption inputs, built the SAME way the
          # mergegate job builds them below. The Guardian-approval signal must
          # resolve a proven closeout as low risk exactly as the MergeGate policy
          # check does; without these inputs the CCA path could not classify a
          # closeout at all, so the exemption would be unreachable and a closeout
          # would still return needs_guardian. Base .shiki snapshot from
          # origin/<base_ref> (the fetch above already ran — do NOT add a second, or
          # the base fetch would go shallow).
          rm -rf .shiki/gha/base-shiki
          mkdir -p .shiki/gha/base-shiki
          git archive "origin/${base_ref}" .shiki | tar -x -C .shiki/gha/base-shiki || true

          # Implementation-PR merge proof: resolve the task id with the SAME
          # semantics mergegate_check.py uses (first T-<4+ digits> OR
          # T-<timestamp>-<hex>), read the BASE snapshot's expected_pr (a field the
          # PR head cannot write, unlike the head's) and pass it as --merged-prs
          # only when gh proves it MERGED. Fails closed to "" on any missing or
          # unresolvable input, so the exemption is never granted without proof.
          MERGED_PRS=""
          body="$(jq -r '.body // ""' .shiki/gha/pr.json)"
          task_id="$(printf '%s' "$body" | grep -oE 'T-([0-9]{4,}|[0-9]{8}T[0-9]{12}Z-[0-9a-f]{8})' | head -1 || true)"
          base_task=".shiki/gha/base-shiki/.shiki/tasks/${task_id}.json"
          if [ -n "$task_id" ] && [ -f "$base_task" ]; then
            base_pr="$(jq -r '.expected_pr // empty' "$base_task")"
            if [ -n "$base_pr" ]; then
              state="$(gh pr view "$base_pr" --repo "$REPOSITORY" --json state -q .state 2>/dev/null || echo UNKNOWN)"
              if [ "$state" = "MERGED" ]; then
                MERGED_PRS="$base_pr"
              fi
            fi
          fi

          # ADR 0015 Contract Approval carry. Build the registration proof the
          # evaluator (shiki_contract_approval.evaluate_contract_approval) reads via
          # --contract-approval, from evidence neither the PR head nor the PR body
          # can forge. Resolve the task id with the SAME regex used above; find the
          # commit that ADDED .shiki/tasks/<task_id>.json on the base branch with
          # `git log --diff-filter=A` over the base ref the fetch above already
          # retrieved (do NOT add a second fetch and do NOT use --depth: a shallow
          # base makes this return nothing and silently defeats the carry, the exact
          # defect PR #206 removed); resolve the MERGED PR behind that commit and its
          # guardian:approved label straight from the GitHub API. Field names match
          # the evaluator (guardian_source, adding_commit_pr) — the authority over the
          # looser list in the task handoff. EVERY failure path writes a well-formed
          # JSON object whose values DEFEAT the carry (the evaluator recomputes
          # applies) with a reason, never an absent or partial file a reader could
          # treat as permissive.
          approval_file=.shiki/gha/contract-approval.json
          ca_base_ref="$(jq -r '.baseRefName // ""' .shiki/gha/pr.json 2>/dev/null || echo "")"
          if [ -z "$task_id" ]; then
            jq -n '{applies: false, reason: "contract approval does not apply: no Shiki task id in the PR body"}' > "$approval_file"
          elif [ -z "$ca_base_ref" ]; then
            jq -n --arg t "$task_id" '{task_id: $t, applies: false, reason: "contract approval does not apply: no base ref resolved"}' > "$approval_file"
          else
            adding_commit="$(git log --diff-filter=A --format=%H "origin/${ca_base_ref}" -- ".shiki/tasks/${task_id}.json" 2>/dev/null | tail -1 || true)"
            if [ -z "$adding_commit" ]; then
              jq -n --arg t "$task_id" '{task_id: $t, merged: false, applies: false, reason: "contract approval does not apply: no commit adds this task file on the base branch (a first-registration PR is never covered)"}' > "$approval_file"
            else
              pulls="$(gh api "repos/${REPOSITORY}/commits/${adding_commit}/pulls" 2>/dev/null || echo "[]")"
              reg_pr="$(printf '%s' "$pulls" | jq 'map(select(.merged_at != null)) | (.[0].number // empty)' 2>/dev/null || echo "")"
              if [ -z "$reg_pr" ]; then
                jq -n --arg t "$task_id" --arg c "$adding_commit" '{task_id: $t, adding_commit: $c, merged: false, applies: false, reason: "contract approval does not apply: no merged PR is associated with the adding commit"}' > "$approval_file"
              else
                guardian_approved="$(printf '%s' "$pulls" | jq --argjson n "$reg_pr" 'any(.[]; .number == $n and ((.labels // []) | any(.name == "guardian:approved")))' 2>/dev/null || echo false)"
                jq -n \
                  --arg t "$task_id" \
                  --argjson pr "$reg_pr" \
                  --arg c "$adding_commit" \
                  --argjson ga "$guardian_approved" \
                  '{
                     task_id: $t,
                     pr: $pr,
                     merged: true,
                     adding_commit: $c,
                     adding_commit_pr: $pr,
                     guardian_approved: $ga,
                     guardian_source: (if $ga then "guardian_label" else "" end),
                     applies: $ga,
                     reason: (if $ga
                       then "task contract registered and Guardian-approved (guardian:approved label) on merged Contract PR \($pr) before dispatch"
                       else "contract approval does not apply: registering PR \($pr) carries no guardian:approved label" end)
                   }' > "$approval_file"
              fi
            fi
          fi
          echo "::group::contract-approval carry"
          cat "$approval_file"
          echo "::endgroup::"

          # Deterministic Guardian-approval signal for CCA-08. The CCA must not
          # judge Guardian approval by LLM-reading raw comments; it reads the
          # result of the SAME authoritative evaluate_guardian_approval the
          # MergeGate policy check uses (recognizes label/review/comment OR an
          # external AI guardian review artifact, ADR 0010). The policy check
          # remains the authoritative gate.
          #
          # ADR 0018 base-sync carry (guardian_comment_carried). --base-sync-carry
          # + --default-branch let the signal carry a stale Guardian comment
          # approval across a proven pure base sync, so it matches the gate rather
          # than under-reporting. The proof reads git history over
          # origin/<default_branch>; the base fetch above already retrieved it —
          # do NOT add a second fetch and do NOT use --depth (a shallow base makes
          # the proof unresolvable and silently disables the carry, the exact
          # defect PR #206 removed). Inert unless BOTH flags are present.
          gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" > .shiki/gha/live-guardian-comments.json || echo "[]" > .shiki/gha/live-guardian-comments.json
          gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/events" > .shiki/gha/live-guardian-events.json || echo "[]" > .shiki/gha/live-guardian-events.json
          gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline" -H "Accept: application/vnd.github+json" > .shiki/gha/live-guardian-timeline.json || echo "[]" > .shiki/gha/live-guardian-timeline.json
          python3 scripts/guardian_approval_signal.py \
            --pr-json .shiki/gha/pr.json \
            --guardian-policy .shiki/guardian-policy.json \
            --guardian-comments .shiki/gha/live-guardian-comments.json \
            --guardian-events .shiki/gha/live-guardian-events.json \
            --guardian-timeline .shiki/gha/live-guardian-timeline.json \
            --expected-repository "${REPOSITORY}" \
            --shiki-root . \
            --base-shiki .shiki/gha/base-shiki/.shiki \
            --changed-files-status .shiki/gha/changed-files-status.txt \
            --merged-prs "$MERGED_PRS" \
            --contract-approval .shiki/gha/contract-approval.json \
            --base-sync-carry \
            --default-branch "$DEFAULT_BRANCH" \
            --output .shiki/gha/guardian-approval.json
          echo "::group::guardian-approval signal"
          cat .shiki/gha/guardian-approval.json
          echo "::endgroup::"

      - name: Prepare CCA transport schema
        id: schema
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/cca-transport.schema.json" <<'JSON'
          {
            "type": "object",
            "required": [
              "verdict",
              "summary",
              "goal_id",
              "task_id",
              "pr",
              "head_sha",
              "can_merge",
              "checklist",
              "acceptance",
              "mergegate",
              "confidence"
            ],
            "properties": {
              "verdict": {
                "enum": [
                  "complete",
                  "repair_required",
                  "blocked",
                  "needs_guardian",
                  "insufficient_evidence"
                ]
              },
              "summary": { "type": "string" },
              "goal_id": { "type": "string" },
              "task_id": { "type": "string" },
              "pr": { "type": "integer" },
              "head_sha": { "type": "string" },
              "can_merge": { "type": "boolean" },
              "blocking_reason": { "type": "string" },
              "checklist": {
                "type": "array",
                "minItems": 1,
                "items": {
                  "type": "object",
                  "required": ["id", "status", "blocking"],
                  "properties": {
                    "id": { "type": "string" },
                    "status": {
                      "type": "string",
                      "enum": ["pass", "fail", "insufficient_evidence", "not_applicable"]
                    },
                    "blocking": { "type": "boolean" },
                    "evidence": { "type": "string" },
                    "reason": { "type": "string" }
                  },
                  "additionalProperties": true
                }
              },
              "acceptance": {
                "type": "array",
                "minItems": 1,
                "items": {
                  "type": "object",
                  "required": ["criterion", "status", "evidence"],
                  "properties": {
                    "criterion": { "type": "string", "minLength": 1 },
                    "status": {
                      "type": "string",
                      "enum": ["pass", "fail", "insufficient_evidence", "not_applicable"]
                    },
                    "evidence": {
                      "type": "array",
                      "items": { "type": "string", "minLength": 1 }
                    },
                    "reason": { "type": "string" }
                  },
                  "additionalProperties": true
                }
              },
              "mergegate": {
                "type": "object",
                "additionalProperties": true
              },
              "repair_packet": {
                "type": ["object", "null"],
                "additionalProperties": true
              },
              "confidence": { "type": "number" }
            },
            "additionalProperties": true
          }
          JSON

          {
            echo "json<<EOF"
            jq -c . "$RUNNER_TEMP/cca-transport.schema.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run CCA
        id: cca
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

            Run the Shiki CCA Completion Check using:
            - .github/prompts/cca-completion-check.md
            - AGENTS.md
            - CLAUDE.md
            - CONTEXT.md
            - docs/agents/checklists.md
            - docs/agents/completion-check-agent.md
            - docs/agents/runtime-auth-model.md
            - .shiki/gha/pr.json
            - .shiki/gha/changed-files.txt
            - .shiki/gha/guardian-approval.json

            For Guardian approval (CCA-08), do NOT interpret raw PR comments
            yourself. Read .shiki/gha/guardian-approval.json (the deterministic
            result of the authoritative evaluate_guardian_approval). If
            "required" is false, CCA-08 is not applicable. If "required" is true
            and "approved" is true, CCA-08 is satisfied by the recorded authority
            in "sources"/"ai_reviewers". Read each recorded source as an authority
            the signal already established; do NOT re-derive it. An external AI
            guardian review is a valid authority per ADR 0010; record it as such,
            never as a human approver. A "guardian_comment_carried" source means
            the signal proved (ADR 0018) that a prior-head Guardian comment
            approval was carried across a pure base sync; read it as a recorded
            Guardian authority and do NOT re-run the base-sync proof or re-judge
            whether the carry applies. If "required" is true and "approved" is
            false, return needs_guardian.

            Judge completion only. Do not edit production code.
            Do not require this CCA verdict check, the downstream MergeGate policy
            check, or advisory Claude review to have completed before returning
            the CCA verdict.
            Return structured JSON matching .shiki/schemas/cca-verdict.schema.json.
          claude_args: |
            --append-system-prompt "You are Shiki CCA. Judge completion only. Do not edit production code. Non-complete verdicts must include precise next actions."
            --json-schema '${{ steps.schema.outputs.json }}'
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*)"

      - name: Enforce CCA verdict
        env:
          STRUCTURED_OUTPUT: ${{ steps.cca.outputs.structured_output }}
          SHIKI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/enforce_cca_verdict.py

      - name: Post Guardian blockers comment
        # Runs even after Enforce CCA verdict fails the job (a needs_guardian
        # verdict is a non-zero exit). When the verdict is needs_guardian the
        # approver otherwise only sees an identical red X; this surfaces the exact
        # missing string on the PR. Reuses the SAME evaluate_guardian_approval via
        # `shiki guardian status` over the evidence already gathered above.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          verdict_file=.shiki/gha/cca-verdict.json
          if [ ! -f "$verdict_file" ]; then
            echo "No CCA verdict file was written; nothing to post."
            exit 0
          fi
          verdict="$(jq -r '.verdict // ""' "$verdict_file")"
          if [ "$verdict" != "needs_guardian" ]; then
            echo "CCA verdict is '${verdict}', not needs_guardian; no Guardian blockers comment."
            exit 0
          fi

          # Render the SAME blockers evaluate_guardian_approval computed, plus the
          # paste-ready Guardian-approval body (marker + full live head SHA), from
          # the evidence the Prepare CCA context step already fetched. --no-git:
          # this checkout is the clean PR head, so there is no unpushed/unsynced
          # SHA drift to detect here (--no-git skips only that drift probe; the
          # base-sync carry proof below still reads git).
          #
          # ADR 0018 base-sync carry (guardian_comment_carried). --base-sync-carry
          # + --default-branch resolve the carry the SAME way the gate does, so the
          # rendered blockers match MergeGate rather than demanding a fresh approval
          # a base sync already carried. The proof reads git over
          # origin/<default_branch>; the checkout is fetch-depth 0 and the base
          # fetch above is reused — do NOT add a second fetch or any --depth.
          python3 scripts/shiki.py guardian status \
            --pr "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --format comment \
            --no-git \
            --guardian-policy .shiki/guardian-policy.json \
            --pr-json .shiki/gha/pr.json \
            --comments .shiki/gha/live-guardian-comments.json \
            --events .shiki/gha/live-guardian-events.json \
            --timeline .shiki/gha/live-guardian-timeline.json \
            --base-sync-carry \
            --default-branch "$DEFAULT_BRANCH" \
            --output .shiki/gha/guardian-status-comment.md

          # Update the existing marker comment in place across re-runs instead of
          # spamming a new comment on every synchronize (mid-run approval churn was
          # a PR #179 failure mode). The comments feed was fetched above. Select on
          # AUTHOR as well as the marker: only github-actions[bot]'s OWN status
          # comment may be PATCHed, so a human who quotes the marker is never
          # overwritten; when no bot comment exists a fresh one is posted below.
          existing_id="$(jq -r 'map(select(((.body // "") | contains("<!-- shiki:guardian-status -->")) and ((.user.login // "") == "github-actions[bot]"))) | (.[0].id // empty)' .shiki/gha/live-guardian-comments.json 2>/dev/null || true)"
          if [ -n "${existing_id:-}" ]; then
            # Read the markdown as a raw string into the request body so nothing in
            # the comment is misinterpreted as a typed field.
            jq -n --rawfile body .shiki/gha/guardian-status-comment.md '{body: $body}' \
              | gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${existing_id}" --input - >/dev/null
            echo "Updated Guardian blockers comment ${existing_id}."
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file .shiki/gha/guardian-status-comment.md
            echo "Posted Guardian blockers comment."
          fi

      - name: CCA Review Bridge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_LOGIN: github-actions[bot]
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p .shiki/gha

          echo "::group::CCA Review Bridge diagnostics"
          echo "Repository: ${REPOSITORY}"
          echo "PR_NUMBER: ${PR_NUMBER}"

          bot_login="${BOT_LOGIN}"
          echo "Authenticated GitHub login: ${bot_login}"

          pr_payload="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          author_login="$(jq -r '.user.login // empty' <<<"$pr_payload")"
          head_sha="$(jq -r '.head.sha // empty' <<<"$pr_payload")"

          echo "PR author login: ${author_login}"
          echo "PR head SHA: ${head_sha}"

          if [ -z "$bot_login" ] || [ -z "$author_login" ] || [ -z "$head_sha" ]; then
            echo "::error::Could not resolve CCA Review Bridge authenticated login, PR author, or PR head SHA."
            exit 1
          fi

          if [ "$bot_login" = "$author_login" ]; then
            echo "::error::Cannot submit CCA Review Bridge approval: authenticated identity is PR author: ${bot_login}"
            exit 1
          fi

          echo "::group::Repository workflow permission diagnostics"
          if gh api "repos/${REPOSITORY}/actions/permissions/workflow" > .shiki/gha/workflow-permissions.json 2> .shiki/gha/workflow-permissions.err; then
            cat .shiki/gha/workflow-permissions.json
          else
            echo "::warning::Could not introspect repository workflow permissions with this token."
            cat .shiki/gha/workflow-permissions.err || true
          fi
          echo "::endgroup::"

          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" > .shiki/gha/reviews-before-bridge.json

          already_approved="$(
            jq -r --arg login "$bot_login" '
              [.[]? | select((.state // "" | ascii_upcase) == "APPROVED") | select(.user.login == $login)] | length
            ' .shiki/gha/reviews-before-bridge.json
          )"

          echo "Existing APPROVED reviews by ${bot_login}: ${already_approved}"

          if [ "$already_approved" = "0" ]; then
            review_body="Shiki CCA Review Bridge approval.

          CCA verdict completed for this PR and Guardian approval evidence is present.

          This automated GitHub Review approval exists to satisfy Shiki required_review policy for solo/self-running operation.

          This is not advisory Claude review. It is emitted only after CCA verdict enforcement succeeds."

            jq -nc \
              --arg event "APPROVE" \
              --arg body "$review_body" \
              --arg commit_id "$head_sha" \
              '{event: $event, body: $body, commit_id: $commit_id}' \
              > .shiki/gha/create-review-request.json

            echo "Submitting REST PR review approval as ${bot_login} for PR #${PR_NUMBER} at ${head_sha}"

            http_status="$(
              curl -sS \
                -o .shiki/gha/create-review-response.json \
                -w "%{http_code}" \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                --data @.shiki/gha/create-review-request.json
            )"

            echo "REST create review HTTP status: ${http_status}"
            cat .shiki/gha/create-review-response.json || true

            case "$http_status" in
              200|201)
                echo "CCA Review Bridge REST approval submitted."
                ;;
              *)
                echo "::error::CCA Review Bridge REST approval failed with HTTP ${http_status}."
                echo "::error::If this is 403 after can_approve_pull_request_reviews=true, GITHUB_TOKEN cannot create the required approval in this repository context. Use a non-author reviewer bot token or GitHub App token."
                exit 1
                ;;
            esac
          else
            echo "CCA Review Bridge approval already exists for ${bot_login}; skipping create-review call."
          fi

          sleep 5

          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" > .shiki/gha/reviews-after-bridge.json

          approved_after="$(
            jq -r --arg login "$bot_login" '
              [.[]? | select((.state // "" | ascii_upcase) == "APPROVED") | select(.user.login == $login)] | length
            ' .shiki/gha/reviews-after-bridge.json
          )"

          echo "APPROVED reviews by ${bot_login} after bridge: ${approved_after}"

          if [ "$approved_after" = "0" ]; then
            echo "::error::CCA Review Bridge did not produce a visible APPROVED review."
            exit 1
          fi

          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json number,title,body,author,headRefName,baseRefName,headRefOid,labels,files,reviews,reviewDecision,statusCheckRollup \
            > .shiki/gha/pr.json

          echo "::endgroup::"

      - name: Build CCA evidence manifest
        run: |
          python3 scripts/build_cca_evidence_manifest.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number || inputs.pr_number }}" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --workflow-name "Shiki CCA Completion" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --event-name "${{ github.event_name }}" \
            --artifact-name "shiki-cca-evidence" \
            --evidence-dir .shiki/gha \
            --output .shiki/gha/cca-evidence-manifest.json

      - name: Upload CCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiki-cca-evidence
          path: .shiki/gha

  mergegate:
    name: MergeGate policy check
    runs-on: ubuntu-latest
    needs: cca
    # MergeGate only reads PR state to reach a verdict; it must never mutate the
    # PR. Pin this job to read-only, overriding the workflow write grants the CCA
    # job needs (enforced by WORKFLOW_CONTRACTS job_permissions in validate_shiki).
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reset CCA evidence runtime directory
        run: |
          rm -rf .shiki/gha
          mkdir -p .shiki/gha

      - name: Download CCA evidence
        uses: actions/download-artifact@v4
        with:
          name: shiki-cca-evidence
          path: .shiki/gha

      - name: Validate Shiki artifacts
        run: python3 scripts/validate_shiki.py

      - name: Refresh live PR state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail

          rm -f .shiki/gha/live-pr.json .shiki/gha/live-changed-files.txt .shiki/gha/live-changed-files-status.txt
          rm -f .shiki/gha/live-guardian-comments.json .shiki/gha/live-guardian-events.json .shiki/gha/live-guardian-timeline.json
          rm -rf .shiki/gha/base-shiki
          mkdir -p .shiki/gha/base-shiki

          gh pr view "$PR_NUMBER" \
            --json number,title,body,author,headRefName,baseRefName,headRefOid,labels,files,reviews,reviewDecision,statusCheckRollup \
            > .shiki/gha/live-pr.json

          gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            > .shiki/gha/live-guardian-comments.json

          gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/events" \
            > .shiki/gha/live-guardian-events.json

          gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/timeline" \
            -H "Accept: application/vnd.github+json" \
            > .shiki/gha/live-guardian-timeline.json

          base_ref="$(jq -r '.baseRefName' .shiki/gha/live-pr.json)"
          head_oid="$(jq -r '.headRefOid' .shiki/gha/live-pr.json)"

          git fetch origin "$base_ref"

          git diff --name-only "origin/${base_ref}...HEAD" \
            > .shiki/gha/live-changed-files.txt

          git diff --name-status "origin/${base_ref}...HEAD" \
            > .shiki/gha/live-changed-files-status.txt

          git archive "origin/${base_ref}" .shiki | tar -x -C .shiki/gha/base-shiki || true

          current_head="$(git rev-parse HEAD)"
          if [ "$head_oid" != "$current_head" ]; then
            echo "::error::Live PR headRefOid ${head_oid} does not match checked out HEAD ${current_head}"
            exit 1
          fi

      - name: Enforce MergeGate
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Implementation-PR merge proof, resolved for EVERY judged PR (not only
          # post_merge_reconcile), the SAME way the Prepare CCA context step
          # resolves it for the CCA signal. Resolve the task id with the SAME
          # semantics mergegate_check.py uses (TASK_ID = T-<4+ digits> OR
          # T-<timestamp>-<hex>, first match; the validator also rejects a body
          # with more than one task id, so this first-match can never disagree
          # with it), read the BASE snapshot's expected_pr (a field the PR head
          # cannot write, unlike the head's) and pass it as --merged-prs only when
          # gh proves it MERGED. Fails closed to "" on any missing or unresolvable
          # input.
          #
          # This must run for every mode. ADR 0017's bookkeeping-closeout
          # exemption (condition 6) needs the implementation PR proven merged, and
          # a closeout carries NO post_merge_reconcile marker; gating this behind
          # the marker left MERGED_PRS empty for closeouts, so the exemption could
          # never be established. post_merge_reconcile PRs still receive exactly
          # this value — that mode already consumes --merged-prs to prove its
          # referenced PR merged — so hoisting the resolution out of the marker
          # test is additive and changes no existing behaviour.
          MERGED_PRS=""
          body="$(jq -r '.body // ""' .shiki/gha/live-pr.json)"
          task_id="$(printf '%s' "$body" | grep -oE 'T-([0-9]{4,}|[0-9]{8}T[0-9]{12}Z-[0-9a-f]{8})' | head -1 || true)"
          base_task=".shiki/gha/base-shiki/.shiki/tasks/${task_id}.json"
          if [ -n "$task_id" ] && [ -f "$base_task" ]; then
            base_pr="$(jq -r '.expected_pr // empty' "$base_task")"
            if [ -n "$base_pr" ]; then
              state="$(gh pr view "$base_pr" --repo "$REPOSITORY" --json state -q .state 2>/dev/null || echo UNKNOWN)"
              if [ "$state" = "MERGED" ]; then
                MERGED_PRS="$base_pr"
              fi
            fi
          fi

          # ADR 0015 Contract Approval carry, built the SAME way the CCA context
          # step builds it (from the base-branch adding commit and the MERGED PR
          # behind it) and passed to mergegate_check.py via --contract-approval. The
          # base fetch in "Refresh live PR state" already retrieved origin/<base_ref>
          # — reuse it; do NOT add a second fetch and do NOT use --depth (a shallow
          # base makes `git log --diff-filter=A` return nothing and silently defeats
          # the carry, the exact defect PR #206 removed). Field names match the
          # evaluator (guardian_source, adding_commit_pr). EVERY failure path writes a
          # well-formed JSON object whose values DEFEAT the carry with a reason.
          approval_file=.shiki/gha/contract-approval.json
          ca_base_ref="$(jq -r '.baseRefName // ""' .shiki/gha/live-pr.json 2>/dev/null || echo "")"
          if [ -z "$task_id" ]; then
            jq -n '{applies: false, reason: "contract approval does not apply: no Shiki task id in the PR body"}' > "$approval_file"
          elif [ -z "$ca_base_ref" ]; then
            jq -n --arg t "$task_id" '{task_id: $t, applies: false, reason: "contract approval does not apply: no base ref resolved"}' > "$approval_file"
          else
            adding_commit="$(git log --diff-filter=A --format=%H "origin/${ca_base_ref}" -- ".shiki/tasks/${task_id}.json" 2>/dev/null | tail -1 || true)"
            if [ -z "$adding_commit" ]; then
              jq -n --arg t "$task_id" '{task_id: $t, merged: false, applies: false, reason: "contract approval does not apply: no commit adds this task file on the base branch (a first-registration PR is never covered)"}' > "$approval_file"
            else
              pulls="$(gh api "repos/${REPOSITORY}/commits/${adding_commit}/pulls" 2>/dev/null || echo "[]")"
              reg_pr="$(printf '%s' "$pulls" | jq 'map(select(.merged_at != null)) | (.[0].number // empty)' 2>/dev/null || echo "")"
              if [ -z "$reg_pr" ]; then
                jq -n --arg t "$task_id" --arg c "$adding_commit" '{task_id: $t, adding_commit: $c, merged: false, applies: false, reason: "contract approval does not apply: no merged PR is associated with the adding commit"}' > "$approval_file"
              else
                guardian_approved="$(printf '%s' "$pulls" | jq --argjson n "$reg_pr" 'any(.[]; .number == $n and ((.labels // []) | any(.name == "guardian:approved")))' 2>/dev/null || echo false)"
                jq -n \
                  --arg t "$task_id" \
                  --argjson pr "$reg_pr" \
                  --arg c "$adding_commit" \
                  --argjson ga "$guardian_approved" \
                  '{
                     task_id: $t,
                     pr: $pr,
                     merged: true,
                     adding_commit: $c,
                     adding_commit_pr: $pr,
                     guardian_approved: $ga,
                     guardian_source: (if $ga then "guardian_label" else "" end),
                     applies: $ga,
                     reason: (if $ga
                       then "task contract registered and Guardian-approved (guardian:approved label) on merged Contract PR \($pr) before dispatch"
                       else "contract approval does not apply: registering PR \($pr) carries no guardian:approved label" end)
                   }' > "$approval_file"
              fi
            fi
          fi
          echo "::group::contract-approval carry"
          cat "$approval_file"
          echo "::endgroup::"

          # ADR 0018 base-sync carry (guardian_comment_carried) passed to the
          # authoritative gate. --base-sync-carry + --default-branch let MergeGate
          # carry a stale Guardian comment approval across a proven pure base sync.
          # The proof reads git over origin/<default_branch>; the base fetch in
          # "Refresh live PR state" already retrieved it — do NOT add a second fetch
          # or any --depth. Inert unless BOTH flags are present.
          python3 scripts/mergegate_check.py \
            --pr-json .shiki/gha/live-pr.json \
            --changed-files .shiki/gha/live-changed-files.txt \
            --changed-files-status .shiki/gha/live-changed-files-status.txt \
            --cca-verdict .shiki/gha/cca-verdict.json \
            --cca-evidence-manifest .shiki/gha/cca-evidence-manifest.json \
            --expected-repository "${{ github.repository }}" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --base-shiki .shiki/gha/base-shiki/.shiki \
            --merged-prs "$MERGED_PRS" \
            --contract-approval .shiki/gha/contract-approval.json \
            --base-sync-carry \
            --default-branch "$DEFAULT_BRANCH" \
            --guardian-policy .shiki/guardian-policy.json \
            --guardian-comments .shiki/gha/live-guardian-comments.json \
            --guardian-events .shiki/gha/live-guardian-events.json \
            --guardian-timeline .shiki/gha/live-guardian-timeline.json
