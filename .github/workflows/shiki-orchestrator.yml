name: Shiki Orchestrator

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to a grilled Shiki plan JSON in the repository"
        required: true
        default: ".shiki/inbox/plan.json"
      mode:
        description: "dry-run or execute-github"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - execute-github
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  shiki-run:
    name: Shiki orchestrator run
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.comment.body, '/shiki') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      plan_path: ${{ steps.command.outputs.plan_path }}
      mode: ${{ steps.command.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve command
        id: command
        shell: bash
        # Comment- and input-derived values reach the shell only through env: —
        # never spliced into the run: body as ${{ }} expressions, which would let a
        # crafted comment body inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_PLAN_PATH: ${{ inputs.plan_path }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "plan_path=${INPUT_PLAN_PATH}" >> "$GITHUB_OUTPUT"
            echo "mode=${INPUT_MODE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          plan_path="$(printf '%s\n' "$COMMENT_BODY" | awk '/^plan:/{print $2; exit}')"
          mode="$(printf '%s\n' "$COMMENT_BODY" | awk '/^mode:/{print $2; exit}')"
          echo "plan_path=${plan_path:-.shiki/inbox/plan.json}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode:-dry-run}" >> "$GITHUB_OUTPUT"

      - name: Run Shiki plan
        shell: bash
        # The resolved command reaches the shell via env: so a plan path carrying a
        # $(...) payload is passed to shiki.py as a literal string, never evaluated.
        env:
          MODE: ${{ steps.command.outputs.mode }}
          PLAN_PATH: ${{ steps.command.outputs.plan_path }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "execute-github" ]]; then
            echo "execute-github requested; this read-only job performs the dry-run gate first."
          fi
          python3 scripts/shiki.py smoke live --target . --plan-file "$PLAN_PATH" --dry-run

  commit-evidence:
    name: Commit Shiki evidence PR
    needs: shiki-run
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'execute-github'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Shiki plan and open evidence PR
        shell: bash
        # run_id and the resolved plan path reach the shell via env:, never as
        # ${{ }} expressions spliced into the run: body.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          PLAN_PATH: ${{ needs.shiki-run.outputs.plan_path }}
        run: |
          set -euo pipefail
          evidence_branch="shiki/orchestrator-evidence-${RUN_ID}"
          git switch -c "$evidence_branch"

          python3 scripts/shiki.py smoke live --target . --plan-file "$PLAN_PATH" --execute-github

          # Stage .shiki BEFORE the change guard: `git diff --quiet` only inspects
          # tracked files, so brand-new (untracked) evidence reports "no changes"
          # and this step would exit 0 without committing. Staging first makes the
          # new files visible to the --cached diff of the index.
          git config user.name "shiki-orchestrator"
          git config user.email "shiki-orchestrator@users.noreply.github.com"
          git add .shiki
          if git diff --cached --quiet; then
            echo "No Shiki evidence changes to commit."
            exit 0
          fi
          git commit -m "shiki: record orchestrator evidence"
          git push -u origin "$evidence_branch"
          gh pr create \
            --base main \
            --head "$evidence_branch" \
            --title "shiki: record orchestrator evidence (${RUN_ID})" \
            --body "Automated Shiki orchestrator evidence from workflow run ${RUN_ID}. Validate, CCA, and MergeGate must pass before this evidence lands."
