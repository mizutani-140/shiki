name: Shiki Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Shiki mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Shiki artifacts
        run: python3 scripts/validate_shiki.py

      - name: Compile Shiki Python files
        run: python3 -m py_compile scripts/*.py

      - name: Run all Shiki contract tests
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/test_shiki_*.sh; do
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done
